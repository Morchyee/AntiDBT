name: Windows CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Deterministic Restore
      run: dotnet restore AntiDbt.sln

    - name: Build Solution
      run: dotnet build AntiDbt.sln -c Release --no-restore -p:UseSharedCompilation=false

    - name: Execute Full Verification Suite
      run: pwsh -File scripts/verify-all.ps1 -SkipRestore

    - name: Upload Verification Summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verification-summary
        path: |
          artifacts/phase5.3/verification-summary.json
          artifacts/phase5.3/diagnostic-telemetry-sample.json
          artifacts/phase5.3/*.log
